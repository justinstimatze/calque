[project]
name = "calque"
version = "0.0.1"
description = "Find dual-path code: two implementations of one contract that have silently drifted."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Justin Stimatze" }]
keywords = ["dual-path", "behavioral-clone", "type-4-clone", "drift", "differential", "code-analysis"]
dependencies = []  # stdlib-only (ast); the LLM oracle is the agent, not a dep

[project.scripts]
calque = "calque.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
